<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo 列表 V2.0 基础版（AI 初版）</title>
<style>
    /* ========== 基础 ========== */
    *,
    *::before,
    *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html {
        font-size: 16px;
        background: #eef1f5;
    }

    body {
        max-width: 30rem;
        margin: 1.875rem auto;
        padding: 1.5rem;
        background: #fff;
        border-radius: 0.5rem;
        box-shadow: 0 0.25rem 1.25rem rgba(0, 0, 0, .08);
        font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        line-height: 1.6;
        color: #333;
    }

    h1 {
        font-size: 1.25rem;
        color: #2c3e50;
        margin-bottom: 1rem;
    }

    /* ========== 输入区 ========== */
    .todo-form {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1rem;
    }

    #todo-input {
        flex: 1 1 auto;
        min-width: 0;
        padding: 0.5rem 0.75rem;
        border: 1px solid #dcdfe6;
        border-radius: 0.25rem;
        font-size: 0.9375rem;
    }

    #add-btn {
        flex: 0 0 auto;
        padding: 0.5rem 1rem;
        border: 0;
        border-radius: 0.25rem;
        background: #3498db;
        color: #fff;
        font-size: 0.9375rem;
        cursor: pointer;
    }

    /* ========== 列表 ========== */
    #todo-list {
        list-style: none;
    }

    #todo-list li {
        padding: 0.5rem 0.75rem;
        margin-bottom: 0.375rem;
        background: #f7f9fc;
        border-left: 0.1875rem solid #3498db;
        border-radius: 0.25rem;
        font-size: 0.9375rem;
    }
</style>
</head>
<body>

    <h1>Todo 列表 · V2.0 基础版</h1>

    <div class="todo-form">
        <input type="text" id="todo-input" placeholder="输入待办事项">
        <button id="add-btn">添加</button>
    </div>

    <ul id="todo-list"></ul>

    <script>
        var input = document.querySelector('#todo-input');
        var addBtn = document.querySelector('#add-btn');
        var todoList = document.querySelector('#todo-list');

        addBtn.addEventListener('click', function () {
            var text = input.value;
            if (text == '') return;
            var li = document.createElement('li');
            li.innerHTML = text;
            todoList.appendChild(li);
            input.value = '';
        });
    </script>

</body>
</html>
